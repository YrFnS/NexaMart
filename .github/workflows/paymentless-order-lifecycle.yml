name: Paymentless order lifecycle generation

on:
  push:
    branches:
      - agent/production-hardening-phase-1
    paths:
      - scripts/apply-paymentless-order-lifecycle.py
      - .github/workflows/paymentless-order-lifecycle.yml

permissions:
  contents: write

concurrency:
  group: paymentless-order-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexamart_paymentless
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexamart_paymentless"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexamart_paymentless?schema=public
      AUTH_SECRET: paymentless-order-secret-with-at-least-32-characters
      NEXTAUTH_SECRET: paymentless-order-secret-with-at-least-32-characters
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXTAUTH_URL: http://localhost:3000
      ENABLE_DEMO_LOGIN: "false"
      SEED_DEMO_PASSWORD: paymentless-demo-password-with-at-least-12-characters
      AUTH_BOOTSTRAP_EMAIL: admin@nexamart.com
      AUTH_BOOTSTRAP_TEST_PASSWORD: paymentless-admin-password-with-at-least-12-characters
      ORDER_CONFIRMATION_TTL_HOURS: "24"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/production-hardening-phase-1
          fetch-depth: 0

      - name: Apply paymentless lifecycle changes
        run: python3 scripts/apply-paymentless-order-lifecycle.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Regenerate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Deploy migrations to a clean database
        run: npm run db:deploy

      - name: Seed paymentless demo data
        run: npm run db:seed

      - name: Verify paymentless lifecycle data
        run: node --experimental-strip-types scripts/verify-order-lifecycle.ts

      - name: Exercise existing-user password bootstrap
        run: |
          password_file="$RUNNER_TEMP/nexamart-paymentless-admin-password"
          printf '%s' "$AUTH_BOOTSTRAP_TEST_PASSWORD" > "$password_file"
          AUTH_BOOTSTRAP_PASSWORD_FILE="$password_file" npm run auth:set-password
          rm -f "$password_file"

      - name: Reject high-severity production advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Run unit tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript
        run: npm run typecheck

      - name: Build production application
        run: npm run build

      - name: Commit verified implementation
        run: |
          rm -f scripts/apply-paymentless-order-lifecycle.py
          rm -f .github/workflows/paymentless-order-lifecycle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No paymentless lifecycle changes were required"
          else
            git commit -m "feat: add paymentless order lifecycle [paymentless-generated]"
            git push origin HEAD:agent/production-hardening-phase-1
          fi
