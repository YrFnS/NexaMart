name: Final hardening cleanup

on:
  push:
    branches:
      - agent/production-hardening-phase-1

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[final-cleanup-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply final hardening cleanup
        run: python3 scripts/final-hardening-cleanup.py

      - name: Refresh exact dependency lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json prisma/schema.prisma prisma/migrations .env.example README.md
          if git diff --cached --quiet; then
            echo "No final cleanup changes were required"
          else
            git commit -m "chore: remove legacy socket dependencies and index chat [final-cleanup-generated]"
            git push
          fi
