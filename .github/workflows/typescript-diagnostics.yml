name: TypeScript diagnostics

on:
  push:
    branches:
      - agent/production-hardening-phase-1
    paths:
      - .github/workflows/typescript-diagnostics.yml

permissions:
  contents: write

concurrency:
  group: typescript-diagnostics
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexamart_diagnostics?schema=public
      AUTH_SECRET: diagnostics-secret-with-at-least-32-characters
      NEXTAUTH_SECRET: diagnostics-secret-with-at-least-32-characters
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXTAUTH_URL: http://localhost:3000
      ENABLE_DEMO_LOGIN: "false"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/production-hardening-phase-1
          fetch-depth: 0

      - name: Apply explicit non-null snapshots
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('src/components/buyer/product-detail-page.tsx'): (
                  "    const currentProductId = productId;\n    if (!currentProductId) return;",
                  "    if (!productId) return;\n    const currentProductId: string = productId;",
              ),
              Path('src/components/buyer/store-profile-page.tsx'): (
                  "    const currentStoreId = storeId;\n    if (!currentStoreId) return;",
                  "    if (!storeId) return;\n    const currentStoreId: string = storeId;",
              ),
              Path('src/components/buyer/product-quick-view.tsx'): (
                  "  const currentProduct = product;\n  if (!currentProduct) return null;",
                  "  if (!product) return null;\n  const currentProduct: Product = product;",
              ),
          }

          for path, (old, new) in replacements.items():
              content = path.read_text()
              if new in content:
                  continue
              if old not in content:
                  raise SystemExit(f'Missing narrowing anchor in {path}')
              path.write_text(content.replace(old, new, 1))
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Verify strict TypeScript
        run: npm run typecheck

      - name: Commit verified narrowing fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/buyer/product-detail-page.tsx src/components/buyer/product-quick-view.tsx src/components/buyer/store-profile-page.tsx
          if git diff --cached --quiet; then
            echo "No narrowing fix was required"
          else
            git commit -m "fix: preserve strict UI data narrowing"
            git push origin HEAD:agent/production-hardening-phase-1
          fi
