name: Staging verification

on:
  pull_request:
  workflow_dispatch:
    inputs:
      staging_url:
        description: HTTPS origin of the deployed staging environment
        required: true
        type: string
      expected_release_sha:
        description: Commit SHA expected from /api/health
        required: true
        type: string
      require_redis:
        description: Require the distributed Upstash Redis limiter
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      expect_noindex:
        description: Require staging to block search indexing
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

concurrency:
  group: staging-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-deployment:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.STAGING_BASE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      STAGING_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.staging_url || vars.STAGING_BASE_URL }}
      PLAYWRIGHT_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.staging_url || vars.STAGING_BASE_URL }}
      EXPECTED_RELEASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_release_sha || github.event.pull_request.head.sha }}
      STAGING_REQUIRE_REDIS: ${{ github.event_name == 'workflow_dispatch' && inputs.require_redis || 'true' }}
      STAGING_EXPECT_NOINDEX: ${{ github.event_name == 'workflow_dispatch' && inputs.expect_noindex || 'true' }}
      STAGING_AUTH_HEADER_NAME: ${{ secrets.STAGING_AUTH_HEADER_NAME }}
      STAGING_AUTH_HEADER_VALUE: ${{ secrets.STAGING_AUTH_HEADER_VALUE }}
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Wait for the expected staging release
        run: |
          attempts=0
          until node --experimental-strip-types scripts/verify-staging-deployment.ts; do
            attempts=$((attempts + 1))
            if [ "$attempts" -ge 30 ]; then
              echo "Staging did not become ready after 30 checks."
              exit 1
            fi
            echo "Staging is not ready yet; retrying in 10 seconds."
            sleep 10
          done

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Run non-mutating staging browser checks
        run: npx playwright test --config=playwright.staging.config.ts

      - name: Upload staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-evidence-${{ github.run_attempt }}
          path: |
            staging-playwright-report/
            staging-test-results/
          if-no-files-found: ignore
          retention-days: 30
