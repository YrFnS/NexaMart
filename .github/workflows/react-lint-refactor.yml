name: React lint refactor

on:
  push:
    branches:
      - agent/production-hardening-phase-1

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[react-lint-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply React state-flow refactor
        run: python3 scripts/fix-react-lint.py

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components src/hooks
          if git diff --cached --quiet; then
            echo "No React lint changes were required"
          else
            git commit -m "refactor: resolve React compiler lint errors [react-lint-generated]"
            git push
          fi
