name: Checkout client authority cleanup

on:
  push:
    branches:
      - agent/production-hardening-phase-1
    paths:
      - scripts/apply-checkout-client-authority.py
      - .github/workflows/checkout-client-authority.yml

permissions:
  contents: write

concurrency:
  group: checkout-client-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[checkout-client-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexamart_checkout_client?schema=public
      AUTH_SECRET: checkout-client-authority-secret-with-at-least-32-characters
      NEXTAUTH_SECRET: checkout-client-authority-secret-with-at-least-32-characters
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXTAUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/production-hardening-phase-1
          fetch-depth: 0

      - name: Apply checked client changes
        run: python3 scripts/apply-checkout-client-authority.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript
        run: npm run typecheck

      - name: Build production application
        run: npm run build

      - name: Commit generated client changes
        run: |
          rm -f scripts/apply-checkout-client-authority.py
          rm -f .github/workflows/checkout-client-authority.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No checkout client changes were required"
          else
            git commit -m "fix: align checkout client with server authority [checkout-client-generated]"
            git push origin HEAD:agent/production-hardening-phase-1
          fi
