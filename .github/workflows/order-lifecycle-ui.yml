name: Order lifecycle UI integration

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - scripts/apply-order-lifecycle-ui.py
      - .github/workflows/order-lifecycle-ui.yml

permissions:
  contents: write

concurrency:
  group: order-lifecycle-ui-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  generate-and-verify:
    if: ${{ github.event.pull_request.head.ref == 'agent/production-hardening-phase-1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexamart_order_ui
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexamart_order_ui"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexamart_order_ui?schema=public
      AUTH_SECRET: order-ui-secret-with-at-least-32-characters
      NEXTAUTH_SECRET: order-ui-secret-with-at-least-32-characters
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXTAUTH_URL: http://localhost:3000
      ENABLE_DEMO_LOGIN: "false"
      SEED_DEMO_PASSWORD: order-ui-demo-password-with-at-least-12-characters
      AUTH_BOOTSTRAP_EMAIL: admin@nexamart.com
      AUTH_BOOTSTRAP_TEST_PASSWORD: order-ui-admin-password-with-at-least-12-characters
      ORDER_CONFIRMATION_TTL_HOURS: "24"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/production-hardening-phase-1
          fetch-depth: 0

      - name: Apply order lifecycle UI changes
        run: python3 scripts/apply-order-lifecycle-ui.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Regenerate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Deploy migrations to a clean database
        run: npm run db:deploy

      - name: Seed paymentless demo data
        run: npm run db:seed

      - name: Verify paymentless lifecycle data
        run: node --experimental-strip-types scripts/verify-order-lifecycle.ts

      - name: Exercise existing-user password bootstrap
        run: |
          password_file="$RUNNER_TEMP/nexamart-order-ui-admin-password"
          printf '%s' "$AUTH_BOOTSTRAP_TEST_PASSWORD" > "$password_file"
          AUTH_BOOTSTRAP_PASSWORD_FILE="$password_file" npm run auth:set-password
          rm -f "$password_file"

      - name: Reject high-severity production advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Run unit tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript
        run: npm run typecheck

      - name: Build production application
        run: npm run build

      - name: Commit verified application integration
        run: |
          git checkout -- .github/workflows/order-lifecycle-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No order lifecycle UI changes were required"
          else
            git commit -m "feat: connect order lifecycle UI [order-ui-generated]"
            git push origin HEAD:agent/production-hardening-phase-1
          fi

# Follow-up trigger after the workflow became available on the branch.
