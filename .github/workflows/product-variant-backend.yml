name: Product variant backend migration

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - scripts/apply-product-variant-backend.py
      - .github/workflows/product-variant-backend.yml

permissions:
  contents: write

concurrency:
  group: product-variant-backend-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ github.event.pull_request.head.ref == 'agent/production-hardening-phase-1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexamart_variant_backend
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexamart_variant_backend"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexamart_variant_backend?schema=public
      AUTH_SECRET: variant-backend-secret-with-at-least-32-characters
      NEXTAUTH_SECRET: variant-backend-secret-with-at-least-32-characters
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXTAUTH_URL: http://localhost:3000
      ENABLE_DEMO_LOGIN: "false"
      SEED_DEMO_PASSWORD: variant-demo-password-with-at-least-12-characters
      AUTH_BOOTSTRAP_EMAIL: admin@nexamart.com
      AUTH_BOOTSTRAP_TEST_PASSWORD: variant-admin-password-with-at-least-12-characters
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/production-hardening-phase-1
          fetch-depth: 0

      - name: Apply checked variant backend changes
        run: python3 scripts/apply-product-variant-backend.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Deploy migrations to a clean database
        run: npm run db:deploy

      - name: Seed variant-backed demo data
        run: npm run db:seed

      - name: Exercise existing-user password bootstrap
        run: |
          password_file="$RUNNER_TEMP/nexamart-variant-admin-password"
          printf '%s' "$AUTH_BOOTSTRAP_TEST_PASSWORD" > "$password_file"
          AUTH_BOOTSTRAP_PASSWORD_FILE="$password_file" npm run auth:set-password
          rm -f "$password_file"

      - name: Reject high-severity production advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Run unit tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript
        run: npm run typecheck

      - name: Build production application
        run: npm run build

      - name: Commit validated variant backend
        run: |
          rm -f scripts/apply-product-variant-backend.py
          rm -f .github/workflows/product-variant-backend.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No product variant backend changes were required"
          else
            git commit -m "feat: add authoritative product variant backend [variant-backend-generated]"
            git push origin HEAD:agent/production-hardening-phase-1
          fi
