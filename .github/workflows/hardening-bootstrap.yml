name: Hardening bootstrap

on:
  push:
    branches:
      - agent/production-hardening-phase-1

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[bootstrap-generated]') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexamart
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexamart"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexamart?schema=public

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch schema and package manifest
        run: python3 scripts/hardening-bootstrap.py

      - name: Regenerate npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Format and validate Prisma schema
        run: |
          npx prisma format
          npx prisma validate

      - name: Apply baseline migration
        run: npx prisma migrate deploy

      - name: Generate production hardening migration
        run: |
          migration_dir="prisma/migrations/20260729010000_production_hardening"
          rm -rf "$migration_dir"
          mkdir -p "$migration_dir"
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --script \
            --output "$migration_dir/migration.sql"
          test -s "$migration_dir/migration.sql"

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json prisma/schema.prisma prisma/migrations
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "chore: align Prisma schema and lockfile [bootstrap-generated]"
            git push
          fi
