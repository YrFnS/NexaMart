name: Dependency lock refresh

on:
  push:
    branches:
      - agent/production-hardening-phase-1
    paths:
      - package.json
      - .github/workflows/dependency-lock-refresh.yml

permissions:
  contents: write

concurrency:
  group: dependency-lock-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[dependency-lock-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexamart_lock_refresh?schema=public
      AUTH_SECRET: dependency-lock-refresh-secret-with-at-least-32-characters
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/production-hardening-phase-1
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate exact lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify exact installation
        run: npm ci

      - name: Reject high-severity production advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already current"
          else
            git commit -m "chore: refresh dependency lock [dependency-lock-generated]"
            git push origin HEAD:agent/production-hardening-phase-1
          fi
