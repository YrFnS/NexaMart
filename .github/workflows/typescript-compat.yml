name: TypeScript compatibility

on:
  push:
    branches:
      - agent/production-hardening-phase-1

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[typescript-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply TypeScript compatibility fixes
        run: python3 scripts/fix-typescript.py

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/password.ts src/lib/security.ts
          if git diff --cached --quiet; then
            echo "No compatibility changes were required"
          else
            git commit -m "fix: resolve TypeScript compatibility errors [typescript-generated]"
            git push
          fi
