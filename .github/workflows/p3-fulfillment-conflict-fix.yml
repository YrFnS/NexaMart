name: Apply P3 fulfillment conflict fixes

on:
  push:
    branches:
      - agent/production-hardening-phase-1
    paths:
      - .github/workflows/p3-fulfillment-conflict-fix.yml

permissions:
  contents: write

concurrency:
  group: p3-fulfillment-conflict-fix
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: agent/production-hardening-phase-1
          fetch-depth: 0

      - name: Apply fulfillment and CI rate-limit fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_string: str, old: str, new: str) -> None:
              path = Path(path_string)
              content = path.read_text()
              if old not in content:
                  raise SystemExit(
                      f'Missing patch anchor in {path_string}: {old[:140]!r}'
                  )
              path.write_text(content.replace(old, new, 1))

          fulfillment_class = """class FulfillmentError extends Error {
            readonly status: number;
            readonly code: string;

            constructor(
              message: string,
              status = 400,
              code = 'FULFILLMENT_ERROR',
            ) {
              super(message);
              this.status = status;
              this.code = code;
            }
          }
          """
          fulfillment_helpers = fulfillment_class + """
          const MAX_SERIALIZABLE_ATTEMPTS = 3;

          function isSerializableConflict(error: unknown): boolean {
            return (
              error instanceof Prisma.PrismaClientKnownRequestError &&
              error.code === 'P2034'
            );
          }

          async function retrySerializableTransaction<T>(
            operation: () => Promise<T>,
          ): Promise<T> {
            for (
              let attempt = 1;
              attempt <= MAX_SERIALIZABLE_ATTEMPTS;
              attempt += 1
            ) {
              try {
                return await operation();
              } catch (error) {
                if (
                  !isSerializableConflict(error) ||
                  attempt === MAX_SERIALIZABLE_ATTEMPTS
                ) {
                  throw error;
                }
              }
            }

            throw new Error(
              'Serializable transaction retry loop exhausted unexpectedly.',
            );
          }
          """
          replace_once(
              'src/app/api/seller/fulfillment/route.ts',
              fulfillment_class,
              fulfillment_helpers,
          )
          replace_once(
              'src/app/api/seller/fulfillment/route.ts',
              """    const result = await db.$transaction(
                async (tx) => {""",
              """    const result = await retrySerializableTransaction(() =>
                db.$transaction(
                  async (tx) => {""",
          )
          replace_once(
              'src/app/api/seller/fulfillment/route.ts',
              """      },
                {
                  isolationLevel: Prisma.TransactionIsolationLevel.Serializable,
                  maxWait: 5_000,
                  timeout: 15_000,
                },
              );""",
              """        },
                  {
                    isolationLevel: Prisma.TransactionIsolationLevel.Serializable,
                    maxWait: 5_000,
                    timeout: 15_000,
                  },
                ),
              );""",
          )
          p2002_block = """    if (
                error instanceof Prisma.PrismaClientKnownRequestError &&
                error.code === 'P2002'
              ) {
                return NextResponse.json(
                  {
                    error: 'A replacement shipment already exists for this return.',
                    code: 'REPLACEMENT_ALREADY_EXISTS',
                  },
                  { status: 409 },
                );
              }
          """
          replace_once(
              'src/app/api/seller/fulfillment/route.ts',
              p2002_block,
              p2002_block + """    if (isSerializableConflict(error)) {
                return NextResponse.json(
                  {
                    error:
                      'The fulfillment record changed while it was being updated. Reload and try again.',
                    code: 'FULFILLMENT_CONFLICT',
                  },
                  { status: 409 },
                );
              }
          """,
          )

          replace_once(
              'src/lib/security.ts',
              """export interface RateLimitConfig {
                maxRequests: number;
                windowSeconds: number;
              }

              export const RATE_LIMITS = {""",
              """export interface RateLimitConfig {
                maxRequests: number;
                windowSeconds: number;
              }

              function ciRateLimitMax(environmentName: string, fallback: number): number {
                if (process.env.CI !== 'true') return fallback;

                const parsed = Number(process.env[environmentName]);
                return Number.isInteger(parsed) && parsed >= fallback ? parsed : fallback;
              }

              export const RATE_LIMITS = {""",
          )
          replace_once(
              'src/lib/security.ts',
              """  auth: { maxRequests: 5, windowSeconds: 60 },
                write: { maxRequests: 20, windowSeconds: 60 },""",
              """  auth: {
                maxRequests: ciRateLimitMax('E2E_AUTH_RATE_LIMIT_MAX_REQUESTS', 5),
                windowSeconds: 60,
              },
              write: {
                maxRequests: ciRateLimitMax('E2E_WRITE_RATE_LIMIT_MAX_REQUESTS', 20),
                windowSeconds: 60,
              },""",
          )

          replace_once(
              '.github/workflows/ci.yml',
              """      AUTH_COOKIE_INSECURE_FOR_TESTS: \"true\"
                    NEXT_TELEMETRY_DISABLED: \"1\"""",
              """      AUTH_COOKIE_INSECURE_FOR_TESTS: \"true\"
                    # Stateful browser tests use isolated sessions from one loopback IP.
                    # These ceilings are honored only when CI=true; deployed defaults
                    # remain 5 auth and 20 write requests per minute.
                    E2E_AUTH_RATE_LIMIT_MAX_REQUESTS: \"30\"
                    E2E_WRITE_RATE_LIMIT_MAX_REQUESTS: \"100\"
                    NEXT_TELEMETRY_DISABLED: \"1\"""",
          )

          replace_once(
              'src/lib/p3-browser-source.test.ts',
              """  const transitionRoute = source(
                'src/app/api/orders/[id]/transition/route.ts',
              );
              const quickView""",
              """  const transitionRoute = source(
                'src/app/api/orders/[id]/transition/route.ts',
              );
              const fulfillmentRoute = source(
                'src/app/api/seller/fulfillment/route.ts',
              );
              const security = source('src/lib/security.ts');
              const quickView""",
          )
          replace_once(
              'src/lib/p3-browser-source.test.ts',
              """  assert.match(transitionRoute, /ORDER_TRANSITION_CONFLICT/);
                assert.match(quickView, /onOpenAutoFocus/);""",
              """  assert.match(transitionRoute, /ORDER_TRANSITION_CONFLICT/);
                assert.match(fulfillmentRoute, /MAX_SERIALIZABLE_ATTEMPTS = 3/);
                assert.match(fulfillmentRoute, /retrySerializableTransaction/);
                assert.match(fulfillmentRoute, /P2034/);
                assert.match(fulfillmentRoute, /FULFILLMENT_CONFLICT/);
                assert.match(security, /process\\.env\\.CI !== 'true'/);
                assert.match(security, /E2E_AUTH_RATE_LIMIT_MAX_REQUESTS/);
                assert.match(security, /E2E_WRITE_RATE_LIMIT_MAX_REQUESTS/);
                assert.match(quickView, /onOpenAutoFocus/);""",
          )
          replace_once(
              'src/lib/p3-browser-source.test.ts',
              """  assert.match(workflow, /AUTH_COOKIE_INSECURE_FOR_TESTS: \"true\"/);
                assert.match(session, /process\\.env\\.CI === 'true'/);""",
              """  assert.match(workflow, /AUTH_COOKIE_INSECURE_FOR_TESTS: \"true\"/);
                assert.match(workflow, /E2E_AUTH_RATE_LIMIT_MAX_REQUESTS: \"30\"/);
                assert.match(workflow, /E2E_WRITE_RATE_LIMIT_MAX_REQUESTS: \"100\"/);
                assert.match(session, /process\\.env\\.CI === 'true'/);""",
          )
          replace_once(
              'src/lib/p3-browser-source.test.ts',
              """  assert.equal(
                existsSync(
                  join(
                    process.cwd(),
                    '.github/workflows/p3-browser-findings-fix.yml',
                  ),
                ),
                false,
              );
            });""",
              """  assert.equal(
                existsSync(
                  join(
                    process.cwd(),
                    '.github/workflows/p3-browser-findings-fix.yml',
                  ),
                ),
                false,
              );
              assert.equal(
                existsSync(
                  join(
                    process.cwd(),
                    '.github/workflows/p3-fulfillment-conflict-fix.yml',
                  ),
                ),
                false,
              );
            });""",
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p3-fulfillment-conflict-fix.yml
          git add src/app/api/seller/fulfillment/route.ts src/lib/security.ts .github/workflows/ci.yml src/lib/p3-browser-source.test.ts
          git commit -m "fix: retry fulfillment races in browser CI"
          git push origin HEAD:agent/production-hardening-phase-1
