name: Refresh dependency lock

on:
  push:
    branches:
      - agent/e2e-role-matrix-and-runtime-fixes
    paths:
      - .github/workflows/refresh-dependency-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/e2e-role-matrix-and-runtime-fixes

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Refresh production dependency lock
        run: |
          npm audit fix --package-lock-only --omit=dev || true
          npm audit --omit=dev --audit-level=high

      - name: Commit refreshed lock and remove one-shot workflow
        run: |
          rm .github/workflows/refresh-dependency-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/refresh-dependency-lock.yml
          git commit -m "fix(deps): refresh audited production lockfile"
          git push origin HEAD:agent/e2e-role-matrix-and-runtime-fixes
