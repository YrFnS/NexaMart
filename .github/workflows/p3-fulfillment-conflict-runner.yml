name: Run P3 fulfillment conflict patch

on:
  push:
    branches:
      - agent/production-hardening-phase-1
    paths:
      - .github/workflows/p3-fulfillment-conflict-runner.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/p3-fulfillment-conflict-runner.yml

permissions:
  contents: write

concurrency:
  group: p3-fulfillment-conflict-runner
  cancel-in-progress: true

jobs:
  patch:
    if: >-
      github.ref_name == 'agent/production-hardening-phase-1' ||
      github.head_ref == 'agent/production-hardening-phase-1'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: agent/production-hardening-phase-1
          fetch-depth: 0

      - name: Apply conflict retries and CI-only request ceilings
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_string: str, old: str, new: str) -> None:
              path = Path(path_string)
              content = path.read_text()
              if old not in content:
                  raise SystemExit(
                      f'Missing patch anchor in {path_string}: {old[:160]!r}'
                  )
              path.write_text(content.replace(old, new, 1))

          fulfillment_path = 'src/app/api/seller/fulfillment/route.ts'
          fulfillment_helpers = (
              "const MAX_SERIALIZABLE_ATTEMPTS = 3;\n\n"
              "function isSerializableConflict(error: unknown): boolean {\n"
              "  return (\n"
              "    error instanceof Prisma.PrismaClientKnownRequestError &&\n"
              "    error.code === 'P2034'\n"
              "  );\n"
              "}\n\n"
              "async function retrySerializableTransaction<T>(\n"
              "  operation: () => Promise<T>,\n"
              "): Promise<T> {\n"
              "  for (\n"
              "    let attempt = 1;\n"
              "    attempt <= MAX_SERIALIZABLE_ATTEMPTS;\n"
              "    attempt += 1\n"
              "  ) {\n"
              "    try {\n"
              "      return await operation();\n"
              "    } catch (error) {\n"
              "      if (\n"
              "        !isSerializableConflict(error) ||\n"
              "        attempt === MAX_SERIALIZABLE_ATTEMPTS\n"
              "      ) {\n"
              "        throw error;\n"
              "      }\n"
              "    }\n"
              "  }\n\n"
              "  throw new Error(\n"
              "    'Serializable transaction retry loop exhausted unexpectedly.',\n"
              "  );\n"
              "}"
          )
          replace_once(
              fulfillment_path,
              "\n}\n\nfunction storeAccessWhere",
              "\n}\n\n" + fulfillment_helpers + "\n\nfunction storeAccessWhere",
          )
          replace_once(
              fulfillment_path,
              "    const result = await db.$transaction(\n"
              "      async (tx) => {",
              "    const result = await retrySerializableTransaction(() =>\n"
              "      db.$transaction(\n"
              "        async (tx) => {",
          )
          replace_once(
              fulfillment_path,
              "      },\n"
              "      {\n"
              "        isolationLevel: Prisma.TransactionIsolationLevel.Serializable,\n"
              "        maxWait: 5_000,\n"
              "        timeout: 15_000,\n"
              "      },\n"
              "    );\n\n"
              "    return NextResponse.json({ success: true, ...result });",
              "        },\n"
              "        {\n"
              "          isolationLevel: Prisma.TransactionIsolationLevel.Serializable,\n"
              "          maxWait: 5_000,\n"
              "          timeout: 15_000,\n"
              "        },\n"
              "      ),\n"
              "    );\n\n"
              "    return NextResponse.json({ success: true, ...result });",
          )
          conflict_response = (
              "    if (isSerializableConflict(error)) {\n"
              "      return NextResponse.json(\n"
              "        {\n"
              "          error:\n"
              "            'The fulfillment record changed while it was being updated. Reload and try again.',\n"
              "          code: 'FULFILLMENT_CONFLICT',\n"
              "        },\n"
              "        { status: 409 },\n"
              "      );\n"
              "    }\n"
          )
          replace_once(
              fulfillment_path,
              "    console.error('Fulfillment workspace PUT error:', error);",
              conflict_response
              + "    console.error('Fulfillment workspace PUT error:', error);",
          )

          security_path = 'src/lib/security.ts'
          security_anchor = (
              "export interface RateLimitConfig {\n"
              "  maxRequests: number;\n"
              "  windowSeconds: number;\n"
              "}\n\n"
              "export const RATE_LIMITS = {"
          )
          security_replacement = (
              "export interface RateLimitConfig {\n"
              "  maxRequests: number;\n"
              "  windowSeconds: number;\n"
              "}\n\n"
              "function ciRateLimitMax(\n"
              "  environmentName: string,\n"
              "  productionDefault: number,\n"
              "  ciDefault: number,\n"
              "): number {\n"
              "  if (process.env.CI !== 'true') return productionDefault;\n\n"
              "  const parsed = Number(process.env[environmentName]);\n"
              "  return Number.isInteger(parsed) && parsed >= productionDefault\n"
              "    ? parsed\n"
              "    : ciDefault;\n"
              "}\n\n"
              "export const RATE_LIMITS = {"
          )
          replace_once(security_path, security_anchor, security_replacement)
          replace_once(
              security_path,
              "  auth: { maxRequests: 5, windowSeconds: 60 },\n"
              "  write: { maxRequests: 20, windowSeconds: 60 },",
              "  auth: {\n"
              "    maxRequests: ciRateLimitMax(\n"
              "      'E2E_AUTH_RATE_LIMIT_MAX_REQUESTS',\n"
              "      5,\n"
              "      30,\n"
              "    ),\n"
              "    windowSeconds: 60,\n"
              "  },\n"
              "  write: {\n"
              "    maxRequests: ciRateLimitMax(\n"
              "      'E2E_WRITE_RATE_LIMIT_MAX_REQUESTS',\n"
              "      20,\n"
              "      100,\n"
              "    ),\n"
              "    windowSeconds: 60,\n"
              "  },",
          )

          source_test = 'src/lib/p3-browser-source.test.ts'
          replace_once(
              source_test,
              "  const transitionRoute = source(\n"
              "    'src/app/api/orders/[id]/transition/route.ts',\n"
              "  );\n"
              "  const quickView",
              "  const transitionRoute = source(\n"
              "    'src/app/api/orders/[id]/transition/route.ts',\n"
              "  );\n"
              "  const fulfillmentRoute = source(\n"
              "    'src/app/api/seller/fulfillment/route.ts',\n"
              "  );\n"
              "  const security = source('src/lib/security.ts');\n"
              "  const quickView",
          )
          replace_once(
              source_test,
              "  assert.match(transitionRoute, /ORDER_TRANSITION_CONFLICT/);\n"
              "  assert.match(quickView, /onOpenAutoFocus/);",
              "  assert.match(transitionRoute, /ORDER_TRANSITION_CONFLICT/);\n"
              "  assert.match(fulfillmentRoute, /MAX_SERIALIZABLE_ATTEMPTS = 3/);\n"
              "  assert.match(fulfillmentRoute, /retrySerializableTransaction/);\n"
              "  assert.match(fulfillmentRoute, /P2034/);\n"
              "  assert.match(fulfillmentRoute, /FULFILLMENT_CONFLICT/);\n"
              "  assert.match(security, /process\\.env\\.CI !== 'true'/);\n"
              "  assert.match(security, /E2E_AUTH_RATE_LIMIT_MAX_REQUESTS/);\n"
              "  assert.match(security, /E2E_WRITE_RATE_LIMIT_MAX_REQUESTS/);\n"
              "  assert.match(security, /productionDefault/);\n"
              "  assert.match(security, /ciDefault/);\n"
              "  assert.match(quickView, /onOpenAutoFocus/);",
          )
          final_guard = (
              "  assert.equal(\n"
              "    existsSync(\n"
              "      join(\n"
              "        process.cwd(),\n"
              "        '.github/workflows/p3-browser-findings-fix.yml',\n"
              "      ),\n"
              "    ),\n"
              "    false,\n"
              "  );\n"
              "});"
          )
          expanded_guard = (
              "  assert.equal(\n"
              "    existsSync(\n"
              "      join(\n"
              "        process.cwd(),\n"
              "        '.github/workflows/p3-browser-findings-fix.yml',\n"
              "      ),\n"
              "    ),\n"
              "    false,\n"
              "  );\n"
              "  assert.equal(\n"
              "    existsSync(\n"
              "      join(\n"
              "        process.cwd(),\n"
              "        '.github/workflows/p3-fulfillment-conflict-fix.yml',\n"
              "      ),\n"
              "    ),\n"
              "    false,\n"
              "  );\n"
              "  assert.equal(\n"
              "    existsSync(\n"
              "      join(\n"
              "        process.cwd(),\n"
              "        '.github/workflows/p3-fulfillment-conflict-runner.yml',\n"
              "      ),\n"
              "    ),\n"
              "    false,\n"
              "  );\n"
              "});"
          )
          replace_once(source_test, final_guard, expanded_guard)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/app/api/seller/fulfillment/route.ts \
            src/lib/security.ts \
            src/lib/p3-browser-source.test.ts
          git diff --cached --check
          git commit -m "fix: retry fulfillment races in browser CI"
          git push origin HEAD:agent/production-hardening-phase-1
