name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexamart_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexamart_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexamart_test?schema=public
      AUTH_SECRET: ci-session-secret-with-at-least-32-characters
      NEXTAUTH_SECRET: ci-session-secret-with-at-least-32-characters
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXTAUTH_URL: http://127.0.0.1:3000
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      ENABLE_DEMO_LOGIN: "false"
      SEED_DEMO_PASSWORD: ci-demo-password-with-at-least-12-characters
      AUTH_BOOTSTRAP_EMAIL: admin@nexamart.com
      AUTH_BOOTSTRAP_TEST_PASSWORD: ci-admin-password-with-at-least-12-characters
      ORDER_CONFIRMATION_TTL_HOURS: "24"
      # Production remains fail-closed when Redis is unavailable. Browser CI
      # explicitly opts into the existing single-process fallback so real API
      # flows can be exercised without external infrastructure.
      RATE_LIMIT_ALLOW_MEMORY_FALLBACK: "true"
      # The production build is served over loopback HTTP in Playwright. This
      # override is honored only when both CI=true and this flag are present;
      # normal production cookies remain Secure by default.
      AUTH_COOKIE_INSECURE_FOR_TESTS: "true"
      # Server-only marker for the loopback Playwright harness. Production
      # deployments must not set this value. It raises only the browser suite's
      # per-IP ceilings because isolated test contexts share 127.0.0.1.
      E2E_BROWSER_TEST_HARNESS: "true"
      E2E_AUTH_RATE_LIMIT_MAX_REQUESTS: "30"
      E2E_WRITE_RATE_LIMIT_MAX_REQUESTS: "100"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Regenerate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Deploy migrations to a clean database
        run: npm run db:deploy

      - name: Verify the migration chain matches prisma/schema.prisma
        run: |
          npx prisma migrate status
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code

      - name: Seed authenticated demo data
        run: npm run db:seed

      - name: Verify paymentless order lifecycle
        run: node --experimental-strip-types scripts/verify-order-lifecycle.ts

      - name: Verify exact order-item return lifecycle
        run: node --experimental-strip-types scripts/verify-return-lifecycle.ts

      - name: Verify fixed-precision pricing and coupon authority
        run: node --experimental-strip-types scripts/verify-pricing-authority.ts

      - name: Verify fulfillment operations
        run: node --experimental-strip-types scripts/verify-fulfillment-operations.ts

      - name: Exercise existing-user password bootstrap
        run: |
          password_file="$RUNNER_TEMP/nexamart-admin-password"
          printf '%s' "$AUTH_BOOTSTRAP_TEST_PASSWORD" > "$password_file"
          AUTH_BOOTSTRAP_PASSWORD_FILE="$password_file" npm run auth:set-password
          rm -f "$password_file"

      - name: Reject high-severity production advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Run unit tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript
        run: npm run typecheck

      - name: Build production application
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Run P3 browser and accessibility tests
        run: npx playwright test

      - name: Upload P3 browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p3-playwright-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
