name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexamart_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexamart_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexamart_test?schema=public
      AUTH_SECRET: ci-session-secret-with-at-least-32-characters
      NEXTAUTH_SECRET: ci-session-secret-with-at-least-32-characters
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXTAUTH_URL: http://localhost:3000
      ENABLE_DEMO_LOGIN: "false"
      SEED_DEMO_PASSWORD: ci-demo-password-with-at-least-12-characters
      AUTH_BOOTSTRAP_EMAIL: admin@nexamart.com
      AUTH_BOOTSTRAP_TEST_PASSWORD: ci-admin-password-with-at-least-12-characters
      ORDER_CONFIRMATION_TTL_HOURS: "24"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fulfillment integrations
        run: |
          python3 scripts/apply-fulfillment-integrations.py
          python3 scripts/fix-fulfillment-ui.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Regenerate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Deploy migrations to a clean database
        run: npm run db:deploy

      - name: Seed authenticated demo data
        run: npm run db:seed

      - name: Verify paymentless order lifecycle
        run: node --experimental-strip-types scripts/verify-order-lifecycle.ts

      - name: Verify exact order-item return lifecycle
        run: node --experimental-strip-types scripts/verify-return-lifecycle.ts

      - name: Verify fixed-precision pricing and coupon authority
        run: node --experimental-strip-types scripts/verify-pricing-authority.ts

      - name: Verify fulfillment operations
        run: node --experimental-strip-types scripts/verify-fulfillment-operations.ts

      - name: Exercise existing-user password bootstrap
        run: |
          password_file="$RUNNER_TEMP/nexamart-admin-password"
          printf '%s' "$AUTH_BOOTSTRAP_TEST_PASSWORD" > "$password_file"
          AUTH_BOOTSTRAP_PASSWORD_FILE="$password_file" npm run auth:set-password
          rm -f "$password_file"

      - name: Reject high-severity production advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Run unit tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript
        run: npm run typecheck

      - name: Build production application
        run: npm run build

      - name: Commit verified fulfillment integrations
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma src/app/api/returns/route.ts src/components/buyer/returns-page.tsx src/components/buyer/orders-page.tsx src/components/seller/fulfillment-operations.tsx
          if git diff --cached --quiet; then
            echo "No generated fulfillment integrations were required"
          else
            git commit -m "feat: integrate fulfillment and exchange operations"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
