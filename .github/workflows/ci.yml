name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexamart
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexamart"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexamart
      AUTH_SECRET: ci-auth-secret-must-be-at-least-32-characters-long
      NEXTAUTH_SECRET: ci-nextauth-secret-must-be-at-least-32-characters
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      ALLOW_DEMO_LOGIN: "false"
      ALLOW_LEGACY_ADMIN_KEY: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate and deploy Prisma migrations
        run: |
          bunx prisma validate
          bunx prisma migrate deploy
          bunx prisma migrate status
          bunx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bun run typecheck

      - name: Security tests
        run: bun run test

      - name: Build
        run: bun run build
