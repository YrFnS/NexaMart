name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexamart_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexamart_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexamart_test?schema=public
      AUTH_SECRET: ci-session-secret-with-at-least-32-characters
      NEXTAUTH_SECRET: ci-session-secret-with-at-least-32-characters
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXTAUTH_URL: http://localhost:3000
      ENABLE_DEMO_LOGIN: "false"
      SEED_DEMO_PASSWORD: ci-demo-password-with-at-least-12-characters
      AUTH_BOOTSTRAP_EMAIL: admin@nexamart.com
      AUTH_BOOTSTRAP_TEST_PASSWORD: ci-admin-password-with-at-least-12-characters
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Deploy migrations to a clean database
        run: npm run db:deploy

      - name: Seed authenticated demo data
        run: npm run db:seed

      - name: Exercise existing-user password bootstrap
        run: |
          password_file="$RUNNER_TEMP/nexamart-admin-password"
          printf '%s' "$AUTH_BOOTSTRAP_TEST_PASSWORD" > "$password_file"
          AUTH_BOOTSTRAP_PASSWORD_FILE="$password_file" npm run auth:set-password
          rm -f "$password_file"

      - name: Reject high-severity production advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Run unit tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript
        run: npm run typecheck

      - name: Build production application
        run: npm run build
