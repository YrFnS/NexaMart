name: Finalize P2 storefront type fix

on:
  push:
    branches:
      - agent/production-hardening-phase-1
    paths:
      - .github/workflows/p2-storefront-type-fix.yml

permissions:
  contents: write

concurrency:
  group: p2-storefront-type-fix
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: agent/production-hardening-phase-1
          fetch-depth: 0

      - name: Patch grouped review typing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/lib/storefront-data.ts')
          content = path.read_text()

          old_query = """      db.storeReview.groupBy({
                by: ['rating'],
                where,
                _count: { _all: true },
              }),"""
          new_query = """      db.storeReview.groupBy({
                by: ['rating'],
                where,
                orderBy: { rating: 'desc' },
                _count: { rating: true },
              }),"""

          old_map = """    const countByRating = new Map(
              groupedRatings.map((entry) => [entry.rating, entry._count._all]),
            );"""
          new_map = """    const countByRating = new Map<number, number>(
              groupedRatings.map((entry) => [entry.rating, entry._count.rating]),
            );"""

          if old_query not in content:
              raise SystemExit('Missing grouped review query anchor')
          if old_map not in content:
              raise SystemExit('Missing grouped review count anchor')

          path.write_text(
              content.replace(old_query, new_query, 1).replace(old_map, new_map, 1)
          )
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Verify strict TypeScript
        run: npm run typecheck

      - name: Commit verified patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/storefront-data.ts
          git rm .github/workflows/p2-storefront-type-fix.yml
          git commit -m "fix: type grouped store review counts"
          git push origin HEAD:agent/production-hardening-phase-1
