name: Bootstrap P3 browser test dependencies

on:
  push:
    branches:
      - agent/production-hardening-phase-1
    paths:
      - .github/workflows/p3-dependency-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: p3-dependency-bootstrap
  cancel-in-progress: true

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: agent/production-hardening-phase-1
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Add exact browser-test dependencies
        run: >-
          npm install
          --save-dev
          --save-exact
          --package-lock-only
          @playwright/test@1.61.1
          @axe-core/playwright@4.11.3

      - name: Verify the generated lockfile
        run: npm ci

      - name: Commit dependency lock and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git rm .github/workflows/p3-dependency-bootstrap.yml
          git commit -m "test: add Playwright and axe dependencies"
          git push origin HEAD:agent/production-hardening-phase-1
